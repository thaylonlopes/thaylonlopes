name: Atualizar Metricas do Ecossistema

on:
  schedule:
    # Executa diariamente as 03:00 UTC (00:00 Horario de Brasilia)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparo manual pelo painel de Actions

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar script de coleta de metricas
        run: node scripts/update-stats.js

      - name: Sincronizar alteracoes no Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao nas metricas hoje."
          else
            git commit -m "chore(metrics): atualizar contadores de downloads e ecossistema"
            git push
          fi

